# electron-builder config. Produces self-contained installers that bundle
# Chromium + Node + the Rust sidecars, so a target machine needs NO Archductor-
# specific runtime libraries (unlike the GTK build, which required
# libgtk-4/libadwaita to be installed). Runtime deps are limited to tools the
# agent shells out to (git, gh, ssh) — declared for deb/rpm below.
appId: ai.perceo.archductor
productName: Archductor
# The GUI launcher binary is named `archductor-desktop` so it never collides
# with the `archductor` CLI (both land in /usr/bin on source installs like the
# AUR package). Applies to every linux target's launcher + generated .desktop.
executableName: archductor-desktop
copyright: Copyright © Perceo

directories:
  output: release
  buildResources: build

# Update feed for electron-updater. CI still packages with `--publish never`;
# this block exists so electron-builder *generates* the update metadata
# (latest.yml / latest-linux.yml, *.blockmap) and bakes app-update.yml into the
# package. Without it the in-app updater has no feed to read.
#
# Only the Windows nsis build and the Linux AppImage actually self-install —
# deb/rpm belong to the system package manager and the macOS build is unsigned,
# so both are told about a release instead. See desktop/electron/updater.ts.
publish:
  provider: github
  owner: perceo-ai
  repo: conductor-arch

# Renderer + main/preload bundles produced by `vite build`.
files:
  - dist/**/*
  - dist-electron/**/*

# Bundle the Rust sidecars alongside the app. main resolves
# resources/bin/archcar at runtime (see electron/archcar.ts). Built by
# `cargo build --release` before packaging.
extraResources:
  - from: ../target/release/archcar
    to: bin/archcar
  - from: ../target/release/archductor
    to: bin/archductor
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  icon: build/icon.png
  synopsis: Parallel coding-agent workflow tool built around Git worktrees.
  description: Archductor desktop UI. Talks to the archcar daemon over a Unix socket.
  desktop:
    entry:
      Name: Archductor
      Categories: Development;IDE;

deb:
  # Only tools the agent runtime shells out to; Chromium/Node are bundled.
  depends:
    - git
    - gh
    - openssh-client

rpm:
  depends:
    - git
    - gh
    - openssh-clients

# AppImage is fully self-contained (bundles its own libs); ideal for "runs on
# any Linux PC" with minimal external deps.
#
# Named from the package rather than from `productName`. These installers are
# attached to the same GitHub release as the CLI's own Linux artifacts, and
# release asset names are unique case-insensitively, so
# `Archductor-<version>-x86_64.AppImage` collided with the CLI's
# `archductor-<version>-x86_64.AppImage`: the upload failed with
# "ReleaseAsset.name already exists", and `gh release upload --clobber` could
# not help, because it looks for an exact-case match to replace and finds none.
# The deb and rpm never collided — they already take their name from the package
# (`archductor-desktop_<version>_amd64.deb`), which is the same rule
# `executableName` follows, so the AppImage now matches them.
appImage:
  artifactName: archductor-desktop-${version}-${arch}.AppImage

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns

win:
  target:
    - nsis
  icon: build/icon.ico
  # Windows sidecar is archcar.exe (override the unix extraResources entry).
  extraResources:
    - from: ../target/release/archcar.exe
      to: bin/archcar.exe
    - from: ../target/release/archductor.exe
      to: bin/archductor.exe
    - from: build/icon.png
      to: icon.png
    - from: build/icon.ico
      to: icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
