# DEPRECATED (pre-Electron): this manifest predates the desktop GUI rewrite. It
# builds only the `archductor` CLI against the GNOME runtime and sets it as the
# launch command, so `flatpak run` starts the CLI, not the desktop app. The old
# GTK app it was written for is removed. A GUI Flatpak needs the
# org.freedesktop.Platform runtime plus flatpak-node-generator-vendored npm
# sources for the desktop/ Electron build; that conversion is tracked as
# follow-up and must pass flatpak-builder before it ships. Use the AUR package,
# AppImage, or deb/rpm for the desktop GUI today.
app-id: ai.perceo.Archductor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: archductor

finish-args:
  # Full filesystem access is required for arbitrary repository and workspace paths.
  - --filesystem=host
  # Network access is required for git fetch, gh CLI, and agent sessions.
  - --share=network
  # IPC and display sockets (retained for the pending Electron desktop build).
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --env=SHELL=/bin/bash

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/archductor/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: archductor
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --locked --workspace
      - install -Dm755 target/release/archductor /app/bin/archductor
      # The daemon has to sit beside the CLI: archductor resolves archcar as a
      # sibling of its own executable before falling back to PATH.
      - install -Dm755 target/release/archcar /app/bin/archcar
      - install -Dm644 README.md /app/share/doc/archductor/README.md
      - install -Dm644 packaging/flatpak/ai.perceo.Archductor.metainfo.xml
          /app/share/metainfo/ai.perceo.Archductor.metainfo.xml
      - install -Dm644 packaging/flatpak/ai.perceo.Archductor.desktop
          /app/share/applications/ai.perceo.Archductor.desktop
      - install -Dm644 packaging/assets/archductor.png
          /app/share/icons/hicolor/256x256/apps/ai.perceo.Archductor.png
      - install -d /app/share/fonts/archductor
      - cp packaging/assets/fonts/*.ttf packaging/assets/fonts/*.otf
          packaging/assets/fonts/*.txt
          /app/share/fonts/archductor/
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
        LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
