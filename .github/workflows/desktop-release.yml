name: Desktop Release

# Builds the Electron desktop app (desktop/) into self-contained installers for
# Linux (AppImage/deb/rpm), macOS (dmg), and Windows (nsis). Each installer
# bundles Chromium + Node + the Rust sidecars (archcar, archductor), so target
# machines need no Archductor-specific runtime libraries.
#
# Runs alongside the GTK publish workflow during the transition; retire that one
# once the Electron app reaches parity.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Derive + validate the release version once, so every downstream job agrees.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - name: Derive version
        id: derive
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="${REF_NAME#v}"
          fi
          # npm-compatible SemVer: MAJOR.MINOR.PATCH with optional -prerelease
          # and +build metadata. Rejects malformed values like 1.2.3.foo.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! grep -Eq "$semver" <<< "$VERSION"; then
            echo "version must be npm-compatible SemVer MAJOR.MINOR.PATCH, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # Gate packaging on the tests + smokes. Packaging cannot start until this
  # passes (see `needs` on the package job).
  verify:
    name: Verify
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      # Rust tests for the crates the desktop UI depends on (archcar RPCs + CLI),
      # plus a CLI smoke of the read RPCs. The full GTK workspace suite runs in
      # ci.yml; the GTK app is being retired.
      - name: Rust tests (core + cli)
        run: cargo test --locked -p archductor-core -p archductor

      - name: Build sidecars for smoke
        run: cargo build --release --locked --bin archcar --bin archductor

      - name: CLI smoke (archcar read RPCs)
        run: |
          set -euo pipefail
          export PATH="$PWD/target/release:$PATH"
          ./target/release/archductor archcar repositories
          ./target/release/archductor archcar workspaces

      - name: Desktop install
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Desktop typecheck + unit tests + build
        working-directory: desktop
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

  # Create or reuse the GitHub release the installers attach to, for BOTH tag
  # pushes and manual dispatch, before any upload runs.
  release:
    name: Ensure release
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$TARGET_SHA"
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: [version, verify, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-14
            platform: mac
          - os: windows-2025
            platform: win
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          # rpm -> rpmbuild for the rpm target; fuse for AppImage.
          sudo apt-get install -y --no-install-recommends rpm fuse libfuse2 git

      - name: Build Rust sidecars (release)
        run: cargo build --release --locked --bin archcar --bin archductor

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Set package version
        working-directory: desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Package installers
        working-directory: desktop
        # No GH_TOKEN here so electron-builder never auto-publishes; the upload
        # step below attaches artifacts explicitly.
        env:
          EB_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          pnpm build
          pnpm exec electron-builder "--$EB_PLATFORM" --publish never

      - name: Collect artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: warn

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          MATRIX_OS: ${{ matrix.os }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(desktop/release/*.AppImage desktop/release/*.deb desktop/release/*.rpm desktop/release/*.dmg desktop/release/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers produced on $MATRIX_OS" >&2
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
