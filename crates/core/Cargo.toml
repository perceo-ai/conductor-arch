[package]
name = "archductor-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test-only delay seams in the archcar input path; see archcar/test_hooks.rs.
# Enabled by the CLI's integration tests, never by a release build.
test-handoff-delay = []

[dependencies]
anyhow = "1"
base64 = "0.23"
ctrlc = { version = "3", features = ["termination"] }
globset = "0.4"
portable-pty = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "event"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["net"] }
